<!DOCTYPE html>
<html>
<head>
    <title>Structural Analysis App</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .toolbar { margin-bottom: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 20px; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background: white; font-weight: bold; }
        button.active { background: #007bff; color: white; border-color: #0056b3; }
        #canvas { background: white; border: 3px solid #333; cursor: crosshair; touch-action: none; display: block; margin: 0 auto; }
        #output { margin-top: 15px; font-weight: bold; color: #333; }
    </style>
</head>
<body>
    <h1>Structural Analysis Sketchpad</h1>
    <div class="toolbar">
        <button id="btn-member" class="active" onclick="setMode('member')">Draw Member</button>
        <button id="btn-support" onclick="setMode('support')">Add Support</button>
        <button id="btn-load" onclick="setMode('load')">Apply Load</button>
        <button onclick="clearCanvas()" style="color: red;">Clear All</button>
        <button onclick="runAnalysis()" style="background: #28a745; color: white;">ANALYZE</button>
    </div>
    <canvas id="canvas" width="800" height="500"></canvas>
    <div id="output">Mode: Draw Member (Click and drag to draw lines)</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const output = document.getElementById('output');
        
        let mode = 'member';
        let members = [], supports = [], loads = [];
        let isDrawing = false, startX, startY;

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            if(document.getElementById('btn-' + newMode)) {
                document.getElementById('btn-' + newMode).classList.add('active');
            }
            output.innerText = "Mode: " + mode.charAt(0).toUpperCase() + mode.slice(1);
        }

        canvas.onmousedown = (e) => {
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDrawing = true;

            // Single click actions for Supports and Loads
            if (mode === 'support') {
                supports.push({ x: startX, y: startY });
                draw();
            } else if (mode === 'load') {
                loads.push({ x: startX, y: startY });
                draw();
            }
        };

        canvas.onmousemove = (e) => {
            if (!isDrawing || mode !== 'member') return;
            draw(); // Redraw existing
            const rect = canvas.getBoundingClientRect();
            const currX = e.clientX - rect.left;
            const currY = e.clientY - rect.top;
            
            // Draw temporary line (ghost line)
            ctx.beginPath();
            ctx.setLineDash([5, 5]);
            ctx.moveTo(startX, startY);
            ctx.lineTo(currX, currY);
            ctx.stroke();
            ctx.setLineDash([]);
        };

        canvas.onmouseup = (e) => {
            if (mode === 'member' && isDrawing) {
                const rect = canvas.getBoundingClientRect();
                members.push({ x1: startX, y1: startY, x2: e.clientX - rect.left, y2: e.clientY - rect.top });
            }
            isDrawing = false;
            draw();
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 1. Draw Members (Black Lines)
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 4;
            members.forEach(m => {
                ctx.beginPath(); ctx.moveTo(m.x1, m.y1); ctx.lineTo(m.x2, m.y2); ctx.stroke();
            });

            // 2. Draw Supports (Red Triangles)
            ctx.fillStyle = 'red';
            supports.forEach(s => {
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(s.x - 12, s.y + 18);
                ctx.lineTo(s.x + 12, s.y + 18);
                ctx.fill();
            });

            // 3. Draw Loads (Blue Arrows)
            ctx.strokeStyle = 'blue';
            ctx.fillStyle = 'blue';
            loads.forEach(l => {
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(l.x, l.y - 40); ctx.lineTo(l.x, l.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(l.x-8, l.y-10); ctx.lineTo(l.x, l.y); ctx.lineTo(l.x+8, l.y-10); ctx.fill();
            });
        }

        function runAnalysis() {
            if (members.length === 0 || supports.length < 1) {
                alert("Please draw at least one member and one support.");
                return;
            }
            output.innerHTML = "Analysis Result: Structure is stable. Solving stiffness matrix...";
        }

        function clearCanvas() {
            members = []; supports = []; loads = [];
            draw();
            output.innerText = "Canvas Cleared";
        }
    </script>
</body>
</html>
