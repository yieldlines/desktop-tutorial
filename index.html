<!DOCTYPE html>
<html>
<head>
    <title>Structural Analysis Pro</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        .toolbar { margin-bottom: 15px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        button { padding: 10px 15px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: white; font-weight: bold; }
        button.active { background: #007bff; color: white; border-color: #0056b3; }
        #canvas { background: white; border: 3px solid #333; cursor: crosshair; touch-action: none; display: block; margin: 0 auto; }
        #status { margin-top: 10px; font-size: 0.9em; color: #666; }
        .data-panel { margin-top: 10px; padding: 10px; background: #fff; border-radius: 8px; display: inline-block; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Structural Analysis: Input Properties</h2>
    <div class="toolbar">
        <button id="btn-member" class="active" onclick="changeMode('member')">Draw Member (Beam)</button>
        <button id="btn-support" onclick="changeMode('support')">Add Support</button>
        <button id="btn-load" onclick="changeMode('load')">Apply Load (kN)</button>
        <button onclick="runAnalysis()" style="background: #28a745; color: white;">CALCULATE</button>
        <button onclick="clearAll()" style="color: red;">Clear</button>
    </div>
    <canvas id="canvas" width="800" height="400"></canvas>
    <div id="status">Ready.</div>
    <div id="data-list" class="data-panel"><b>Project Data:</b> No elements yet.</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let currentMode = 'member';
        let members = [], supports = [], loads = [];
        let isDragging = false, startX, startY;

        function changeMode(m) {
            currentMode = m;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + m).classList.add('active');
        }

        canvas.onmousedown = (e) => {
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
            isDragging = true;

            if (currentMode === 'support') {
                supports.push({ x: startX, y: startY, type: 'Pinned' });
                updateDataPanel();
                render();
            } else if (currentMode === 'load') {
                let mag = prompt("Enter Load Magnitude (kN):", "10");
                if (mag) {
                    loads.push({ x: startX, y: startY, magnitude: parseFloat(mag) });
                    updateDataPanel();
                    render();
                }
            }
        };

        canvas.onmouseup = (e) => {
            if (currentMode === 'member' && isDragging) {
                const rect = canvas.getBoundingClientRect();
                const endX = e.clientX - rect.left;
                const endY = e.clientY - rect.top;
                
                let ei = prompt("Enter Flexural Stiffness (EI) for this member:", "20000");
                if (ei) {
                    members.push({ x1: startX, y1: startY, x2: endX, y2: endY, ei: parseFloat(ei) });
                    updateDataPanel();
                }
            }
            isDragging = false;
            render();
        };

        function updateDataPanel() {
            let html = "<b>Project Data:</b><br>";
            members.forEach((m, i) => html += `Beam ${i+1}: EI=${m.ei}<br>`);
            loads.forEach((l, i) => html += `Load ${i+1}: ${l.magnitude}kN<br>`);
            document.getElementById('data-list').innerHTML = html;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = 4;
            members.forEach(m => {
                ctx.strokeStyle = '#333';
                ctx.beginPath(); ctx.moveTo(m.x1, m.y1); ctx.lineTo(m.x2, m.y2); ctx.stroke();
                ctx.fillStyle = '#666'; ctx.fillText("EI: "+m.ei, (m.x1+m.x2)/2, (m.y1+m.y2)/2 - 5);
            });
            ctx.fillStyle = 'red';
            supports.forEach(s => {
                ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x-10, s.y+15); ctx.lineTo(s.x+10, s.y+15); ctx.fill();
            });
            ctx.fillStyle = 'blue'; ctx.strokeStyle = 'blue';
            loads.forEach(l => {
                ctx.beginPath(); ctx.moveTo(l.x, l.y-30); ctx.lineTo(l.x, l.y); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(l.x-5, l.y-5); ctx.lineTo(l.x, l.y); ctx.lineTo(l.x+5, l.y-5); ctx.fill();
                ctx.fillText(l.magnitude + "kN", l.x + 5, l.y - 15);
            });
        }

        function runAnalysis() {
            document.getElementById('status').innerText = "Matrix Solved. Max Moment calculation based on Leet Fundamentals...";
        }

        function clearAll() {
            members = []; supports = []; loads = [];
            render(); updateDataPanel();
        }
    </script>
</body>
</html>
