<!DOCTYPE html>
<html>
<head>
    <title>Structural Analysis Pro</title>
    <style>
        body { font-family: sans-serif; display: flex; height: 100vh; margin: 0; background: #f0f2f5; }
        .sidebar { width: 250px; background: white; padding: 20px; border-right: 2px solid #ddd; display: flex; flex-direction: column; gap: 15px; }
        .main { flex-grow: 1; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        canvas { background: white; border: 3px solid #333; cursor: crosshair; touch-action: none; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        button { padding: 10px; cursor: pointer; font-weight: bold; border-radius: 5px; border: 1px solid #ccc; background: #fff; }
        button.active { background: #007bff; color: white; }
        .input-group { display: flex; flex-direction: column; font-size: 14px; }
        input { padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .calc-btn { background: #28a745; color: white; border: none; margin-top: 20px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Properties</h3>
    
    <div class="input-group">
        <label>Member Stiffness (EI):</label>
        <input type="number" id="prop-ei" value="20000">
    </div>

    <div class="input-group">
        <label>Load Magnitude (kN):</label>
        <input type="number" id="prop-load" value="10">
    </div>

    <hr style="width:100%">
    
    <button id="btn-member" class="active" onclick="setMode('member')">Draw Member</button>
    <button id="btn-support" onclick="setMode('support')">Add Support</button>
    <button id="btn-load" onclick="setMode('load')">Apply Load</button>
    
    <button class="calc-btn" onclick="runAnalysis()">ANALYZE</button>
    <button onclick="location.reload()" style="color:red">Reset All</button>
</div>

<div class="main">
    <h1>Structural Sketchpad</h1>
    <canvas id="canvas" width="800" height="500"></canvas>
    <p id="status">Mode: Drawing Members with EI = 20000</p>
</div>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let mode = 'member';
    let members = [], supports = [], loads = [];
    let isDrawing = false, startX, startY;

    function setMode(m) {
        mode = m;
        document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + m).classList.add('active');
        document.getElementById('status').innerText = "Mode: " + m.toUpperCase();
    }

    canvas.onmousedown = (e) => {
        const rect = canvas.getBoundingClientRect();
        startX = e.clientX - rect.left;
        startY = e.clientY - rect.top;
        isDrawing = true;

        if (mode === 'support') {
            supports.push({ x: startX, y: startY });
            render();
        } else if (mode === 'load') {
            const val = document.getElementById('prop-load').value;
            loads.push({ x: startX, y: startY, magnitude: val });
            render();
        }
    };

    canvas.onmouseup = (e) => {
        if (mode === 'member' && isDrawing) {
            const rect = canvas.getBoundingClientRect();
            const eiVal = document.getElementById('prop-ei').value;
            members.push({ x1: startX, y1: startY, x2: e.clientX - rect.left, y2: e.clientY - rect.top, ei: eiVal });
        }
        isDrawing = false;
        render();
    };

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Members
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#333';
        members.forEach(m => {
            ctx.beginPath(); ctx.moveTo(m.x1, m.y1); ctx.lineTo(m.x2, m.y2); ctx.stroke();
            ctx.fillStyle = "blue"; ctx.fillText("EI="+m.ei, (m.x1+m.x2)/2, (m.y1+m.y2)/2 - 10);
        });

        // Supports
        ctx.fillStyle = 'red';
        supports.forEach(s => {
            ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x-12, s.y+20); ctx.lineTo(s.x+12, s.y+20); ctx.fill();
        });

        // Loads
        ctx.strokeStyle = 'green'; ctx.fillStyle = 'green';
        loads.forEach(l => {
            ctx.beginPath(); ctx.moveTo(l.x, l.y-40); ctx.lineTo(l.x, l.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(l.x-8, l.y-10); ctx.lineTo(l.x, l.y); ctx.lineTo(l.x+8, l.y-10); ctx.fill();
            ctx.fillText(l.magnitude + "kN", l.x + 5, l.y - 20);
        });
    }

    function runAnalysis() {
        alert("Analyzing structure with " + members.length + " members...");
    }
</script>

</body>
</html>
