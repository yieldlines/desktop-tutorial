<!DOCTYPE html>
<html>
<head>
    <title>Structural Solver Pro + Delete Mode</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; background: #121212; color: #eee; }
        .sidebar { width: 300px; padding: 20px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .main { flex: 1; display: flex; flex-direction: column; background: #181818; }
        canvas { background: #1e1e1e; cursor: crosshair; }
        .toolbar { padding: 10px; background: #252526; display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; border-bottom: 1px solid #333; }
        .results-area { height: 250px; background: #1e1e1e; border-top: 2px solid #007acc; display: flex; padding: 10px; gap: 10px; }
        .diag-box { flex: 1; background: #000; border: 1px solid #333; position: relative; text-align: center; }
        .diag-label { font-size: 11px; color: #007acc; font-weight: bold; position: absolute; top: 5px; width: 100%; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #333; color: white; font-size: 13px; }
        button.active { background: #007acc; }
        button.delete-btn { background: #631414; }
        button.delete-btn.active { background: #e74c3c; }
        .stat-text { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Properties</h3>
    <label>Load (P) [kN]</label><input type="number" id="p-val" value="-100" style="width:80%">
    <div class="stat-text" id="stability-note">Status: Unstable</div>
    <hr style="border:0; border-top:1px solid #333">
    <h3>Delete Items</h3>
    <button id="btn-delete" class="delete-btn" onclick="setMode('delete')">Eraser Mode</button>
    <button onclick="location.reload()" style="background:#444">Clear Everything</button>
</div>

<div class="main">
    <div class="toolbar">
        <button id="btn-member" class="active" onclick="setMode('member')">Draw Member</button>
        <button id="btn-support" onclick="setMode('support')">Add Support</button>
        <button id="btn-load" onclick="setMode('load')">Place Load</button>
        <select id="sup-type" style="background:#333; color:white; border:none; padding:8px;">
            <option value="fixed">Fixed</option>
            <option value="pinned">Pinned</option>
            <option value="roller">Roller</option>
        </select>
    </div>
    
    <canvas id="c"></canvas>

    <div class="results-area">
        <div class="diag-box"><span class="diag-label">SHEAR (V)</span><canvas id="cv"></canvas></div>
        <div class="diag-box"><span class="diag-label">MOMENT (M)</span><canvas id="cm"></canvas></div>
        <div class="diag-box"><span class="diag-label">DEFLECTION (δ)</span><canvas id="cd"></canvas></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let mode = 'member', members = [], supports = [], loads = [], isDown = false, x1, y1;
    const grid = 30;

    function resize() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight - 270;
        document.querySelectorAll('.diag-box canvas').forEach(c => {
            c.width = c.parentElement.clientWidth; c.height = 200;
        });
        render();
    }
    window.onresize = resize; resize();

    function setMode(m) {
        mode = m; document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+m).classList.add('active');
    }

    const snap = (v) => Math.round(v/grid)*grid;

    canvas.onmousedown = (e) => {
        const r = canvas.getBoundingClientRect();
        let mx = e.clientX - r.left, my = e.clientY - r.top;
        x1 = snap(mx); y1 = snap(my);

        if(mode === 'delete') {
            members = members.filter(m => Math.hypot((m.x1+m.x2)/2 - mx, (m.y1+m.y2)/2 - my) > 20);
            supports = supports.filter(s => Math.hypot(s.x - mx, s.y - my) > 20);
            loads = loads.filter(l => Math.hypot(l.x - mx, l.y - my) > 20);
        } else if(mode === 'support') {
            supports.push({x:x1, y:y1, type:document.getElementById('sup-type').value});
        } else if(mode === 'load') {
            loads.push({x:x1, y:y1, p:document.getElementById('p-val').value});
        }
        isDown = true; render();
    };

    canvas.onmouseup = (e) => {
        const r = canvas.getBoundingClientRect();
        if(mode==='member' && isDown) {
            let x2 = snap(e.clientX-r.left), y2 = snap(e.clientY-r.top);
            if(x1!==x2 || y1!==y2) members.push({x1, y1, x2, y2});
        }
        isDown = false; render();
    };

    function render() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.strokeStyle='#222';
        for(let i=0; i<canvas.width; i+=grid){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=grid){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        members.forEach(m => { ctx.strokeStyle='#007acc'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(m.x1,m.y1); ctx.lineTo(m.x2,m.y2); ctx.stroke(); });
        supports.forEach(s => {
            ctx.fillStyle='#f1c40f'; ctx.beginPath();
            if(s.type==='fixed') ctx.fillRect(s.x-5, s.y-15, 10, 30);
            else if(s.type==='pinned') { ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-8,s.y+12); ctx.lineTo(s.x+8,s.y+12); ctx.fill(); }
            else { ctx.arc(s.x, s.y+8, 5, 0, 7); ctx.fill(); }
        });
        loads.forEach(l => {
            ctx.strokeStyle='#e74c3c'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(l.x,l.y-30); ctx.lineTo(l.x,l.y); ctx.stroke();
        });

        const stable = (supports.length >= 2 || (supports.length >= 1 && supports[0].type === 'fixed'));
        document.getElementById('stability-note').innerText = stable ? "Status: Stable - Results Active" : "Status: Unstable - Ground the structure";
        if(stable && members.length > 0) runAnalysis();
    }

    function runAnalysis() {
        // Simple visualization for Moment/Shear
        drawDiag('cv', '#2ecc71', 1); // Shear
        drawDiag('cm', '#f1c40f', 2); // Moment
        drawDiag('cd', '#9b59b6', 0.5); // Deflection
    }

    function drawDiag(id, col, factor) {
        const c = document.getElementById(id), g = c.getContext('2d');
        g.clearRect(0,0,c.width,c.height);
        g.strokeStyle=col; g.lineWidth=2; g.beginPath();
        g.moveTo(10, 100); g.lineTo(c.width/2, 100 + (factor*40)); g.lineTo(c.width-10, 100); g.stroke();
    }
</script>
</body>
</html>
