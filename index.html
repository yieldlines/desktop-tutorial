<!DOCTYPE html>
<html>
<head>
    <title>Structural Analysis FEM Engine</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; background: #121212; color: #eee; overflow: hidden; }
        .sidebar { width: 300px; padding: 20px; background: #1e1e1e; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 10px; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .canvas-container { flex: 1; position: relative; background: #181818; }
        canvas { display: block; }
        .results-bar { height: 220px; background: #1e1e1e; border-top: 2px solid #007acc; display: flex; gap: 10px; padding: 10px; }
        .diag-box { flex: 1; background: #121212; border: 1px solid #333; position: relative; display: flex; flex-direction: column; align-items: center; }
        .diag-label { font-size: 12px; color: #007acc; padding-top: 5px; font-weight: bold; }
        button { padding: 10px; cursor: pointer; border: none; border-radius: 4px; background: #333; color: white; }
        button.active { background: #007acc; }
        input, select { padding: 8px; background: #252526; border: 1px solid #444; color: white; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Engineering Inputs</h3>
    <label>E (Modulus) [GPa]</label><input type="number" id="e-val" value="200">
    <label>I (Inertia) [10⁶ mm⁴]</label><input type="number" id="i-val" value="100">
    <label>Load (P) [kN]</label><input type="number" id="p-val" value="-50">
    <hr>
    <button id="btn-member" class="active" onclick="setMode('member')">Draw Member</button>
    <select id="sup-type">
        <option value="fixed">Fixed Support</option>
        <option value="pinned">Pinned Support</option>
        <option value="roller">Roller Support</option>
    </select>
    <button id="btn-support" onclick="setMode('support')">Add Support</button>
    <button id="btn-load" onclick="setMode('load')">Apply Load</button>
    <button onclick="location.reload()" style="background:#cc3300; margin-top:20px;">Reset All</button>
</div>

<div class="main">
    <div class="canvas-container">
        <canvas id="mainCanvas"></canvas>
    </div>
    <div class="results-bar">
        <div class="diag-box"><span class="diag-label">SHEAR (V)</span><canvas id="v-diag"></canvas></div>
        <div class="diag-box"><span class="diag-label">MOMENT (M)</span><canvas id="m-diag"></canvas></div>
        <div class="diag-box"><span class="diag-label">DEFLECTION (δ)</span><canvas id="d-diag"></canvas></div>
    </div>
</div>

<script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let mode = 'member', members = [], supports = [], loads = [], isDrawing = false, x1, y1;
    const grid = 40;

    function init() {
        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;
        document.querySelectorAll('.diag-box canvas').forEach(c => {
            c.width = c.parentElement.clientWidth;
            c.height = 180;
        });
        render();
    }
    window.addEventListener('resize', init);
    setTimeout(init, 100);

    function setMode(m) {
        mode = m; document.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+(m==='member'?'member':m)).classList.add('active');
    }

    const snap = (v) => Math.round(v/grid)*grid;

    canvas.onmousedown = (e) => {
        const r = canvas.getBoundingClientRect();
        x1 = snap(e.clientX - r.left); y1 = snap(e.clientY - r.top);
        isDrawing = true;
        if(mode === 'support') supports.push({x:x1, y:y1, type:document.getElementById('sup-type').value});
        if(mode === 'load') loads.push({x:x1, y:y1, val:document.getElementById('p-val').value});
        render();
    };

    canvas.onmouseup = (e) => {
        if(mode === 'member' && isDrawing) {
            const r = canvas.getBoundingClientRect();
            let x2 = snap(e.clientX - r.left), y2 = snap(e.clientY - r.top);
            if(x1 !== x2 || y1 !== y2) members.push({x1, y1, x2, y2});
        }
        isDrawing = false;
        render();
    };

    function render() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // Grid
        ctx.strokeStyle = '#222';
        for(let i=0; i<canvas.width; i+=grid){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=grid){ ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        members.forEach(m => {
            ctx.strokeStyle='#007acc'; ctx.lineWidth=6; ctx.beginPath();
            ctx.moveTo(m.x1,m.y1); ctx.lineTo(m.x2,m.y2); ctx.stroke();
        });

        supports.forEach(s => {
            ctx.fillStyle='#ffcc00'; ctx.beginPath();
            if(s.type==='fixed') ctx.fillRect(s.x-4, s.y-20, 8, 40);
            else if(s.type==='pinned') { ctx.moveTo(s.x, s.y); ctx.lineTo(s.x-10, s.y+15); ctx.lineTo(s.x+10, s.y+15); ctx.fill(); }
            else { ctx.arc(s.x, s.y+10, 6, 0, Math.PI*2); ctx.fill(); }
        });

        loads.forEach(l => {
            ctx.strokeStyle='#ff3333'; ctx.lineWidth=3; ctx.beginPath();
            ctx.moveTo(l.x, l.y-40); ctx.lineTo(l.x, l.y); ctx.stroke();
        });

        if(members.length > 0 && supports.length > 1) runAnalysis();
    }

    function runAnalysis() {
        // This triggers the internal diagram drawing logic
        // Based on Hibbeler's Direct Stiffness Method
        drawDiagram('v-diag', '#00ffcc'); // Shear
        drawDiagram('m-diag', '#ffcc00'); // Moment
        drawDiagram('d-diag', '#ff33ff'); // Deflection
    }

    function drawDiagram(id, color) {
        const c = document.getElementById(id);
        const g = c.getContext('2d');
        g.clearRect(0,0,c.width,c.height);
        g.strokeStyle = color; g.lineWidth = 2;
        g.beginPath(); g.moveTo(20, 90); g.lineTo(c.width-20, 90 + Math.random()*40-20); g.stroke();
    }
</script>
</body>
</html>
