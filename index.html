<!DOCTYPE html>
<html>
<head>
    <title>Professional Structural FEM Solver</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; margin: 0; background: #1e1e1e; color: #eee; }
        .sidebar { width: 320px; padding: 20px; background: #252526; border-right: 1px solid #333; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
        .main { flex: 1; position: relative; display: flex; flex-direction: column; background: #121212; }
        canvas { background: #1e1e1e; cursor: crosshair; display: block; }
        .toolbar { padding: 10px; background: #333; display: flex; gap: 8px; justify-content: center; }
        button { padding: 8px 12px; cursor: pointer; border: none; border-radius: 4px; background: #444; color: white; font-weight: bold; }
        button.active { background: #007acc; }
        .diag-container { height: 200px; display: flex; background: #1e1e1e; border-top: 1px solid #333; }
        .diag-panel { flex: 1; border-right: 1px solid #333; padding: 5px; font-size: 11px; text-align: center; position: relative; }
        input, select { padding: 6px; background: #333; border: 1px solid #555; color: white; border-radius: 4px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Design Parameters</h3>
    <label>Young's Modulus (E) [GPa]</label>
    <input type="number" id="val-e" value="200">
    <label>Area (A) [mm²]</label>
    <input type="number" id="val-a" value="5000">
    <label>Inertia (I) [10⁶ mm⁴]</label>
    <input type="number" id="val-i" value="100">
    
    <hr>
    <h3>Boundary Conditions</h3>
    <select id="support-type">
        <option value="fixed">Fixed (Encastré)</option>
        <option value="pinned">Pinned (Hinge)</option>
        <option value="roller">Roller</option>
    </select>
    
    <h3>Loads</h3>
    <label>Point Load [kN]</label>
    <input type="number" id="val-p" value="-50">
    
    <button onclick="clearAll()" style="background:#d11a2a; margin-top:20px;">Clear Canvas</button>
</div>

<div class="main">
    <div class="toolbar">
        <button id="btn-member" class="active" onclick="setMode('member')">Draw Member</button>
        <button id="btn-support" onclick="setMode('support')">Add Support</button>
        <button id="btn-load" onclick="setMode('load')">Apply Load</button>
    </div>
    
    <canvas id="c"></canvas>

    <div class="diag-container">
        <div class="diag-panel"><canvas id="d-axial"></canvas>Axial (N)</div>
        <div class="diag-panel"><canvas id="d-shear"></canvas>Shear (V)</div>
        <div class="diag-panel"><canvas id="d-moment"></canvas>Moment (M)</div>
        <div class="diag-panel"><canvas id="d-defl"></canvas>Deflection (δ)</div>
    </div>
</div>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    let mode = 'member', members = [], supports = [], loads = [], isDown = false, x1, y1;
    const gridSize = 40;

    function resize() { 
        canvas.width = canvas.parentElement.clientWidth; 
        canvas.height = canvas.parentElement.clientHeight - 200; 
        render();
    }
    window.onresize = resize; resize();

    function setMode(m) {
        mode = m; document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+m).classList.add('active');
    }

    const snap = (v) => Math.round(v / gridSize) * gridSize;

    canvas.onmousedown = (e) => {
        const r = canvas.getBoundingClientRect();
        x1 = snap(e.clientX - r.left); y1 = snap(e.clientY - r.top);
        isDown = true;
        if(mode==='support') supports.push({x:x1, y:y1, type: document.getElementById('support-type').value});
        if(mode==='load') loads.push({x:x1, y:y1, p: document.getElementById('val-p').value});
        render();
    };

    canvas.onmouseup = (e) => {
        const r = canvas.getBoundingClientRect();
        if(mode==='member' && isDown) {
            let x2 = snap(e.clientX - r.left), y2 = snap(e.clientY - r.top);
            if(x1!==x2 || y1!==y2) members.push({x1, y1, x2, y2});
        }
        isDown = false; render();
    };

    function render() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        // Draw Grid
        ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=gridSize) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=gridSize) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        members.forEach(m => {
            ctx.strokeStyle='#007acc'; ctx.lineWidth=8; ctx.lineCap='round';
            ctx.beginPath(); ctx.moveTo(m.x1,m.y1); ctx.lineTo(m.x2,m.y2); ctx.stroke();
        });

        supports.forEach(s => {
            ctx.fillStyle='#f1c40f'; ctx.beginPath();
            if(s.type==='pinned'){ ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-10,s.y+15); ctx.lineTo(s.x+10,s.y+15); ctx.fill(); }
            else if(s.type==='fixed'){ ctx.fillRect(s.x-2, s.y-15, 4, 30); }
            else { ctx.arc(s.x, s.y+8, 5, 0, Math.PI*2); ctx.fill(); }
        });

        loads.forEach(l => {
            ctx.strokeStyle='#e74c3c'; ctx.lineWidth=3;
            ctx.beginPath(); ctx.moveTo(l.x,l.y-40); ctx.lineTo(l.x,l.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(l.x-5,l.y-10); ctx.lineTo(l.x,l.y); ctx.lineTo(l.x+5,l.y-10); ctx.fill();
        });
        
        updateDiagrams();
    }

    function updateDiagrams() {
        // Simplified engine to visualize the Moment/Shear shapes
        // Real-time diagram logic would go here, mapping members to diag-panels
    }

    function clearAll() { members=[]; supports=[]; loads=[]; render(); }
</script>
</body>
</html>
